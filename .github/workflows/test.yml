name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - name: Boot Docker stack
        run: docker compose up -d --build

      - name: Smoke test (wait for PHP + DB)
        run: ./docker/smoke_test.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run pytest (group ${{ matrix.group }} of 2)
        run: pytest tests/ -v --splits 2 --group ${{ matrix.group }}

      - name: Capture docker logs on failure
        if: failure()
        run: docker compose logs --tail=200

  test:
    runs-on: ubuntu-latest
    needs: test-shard
    if: always()
    steps:
      - name: Aggregate shard results
        run: |
          if [ "${{ needs.test-shard.result }}" != "success" ]; then
            echo "One or more test shards failed (result=${{ needs.test-shard.result }})"
            exit 1
          fi
          echo "All test shards passed"
